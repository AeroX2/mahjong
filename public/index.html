  pond.innerHTML = G.center.map((d,i)=>{
    const last = G.lastDiscard && G.lastDiscard.id===d.id;
    const html = `<div class="pond-tile ${last?'last':''} ${d.fresh?'fresh':''}" style="left:${(d.x*100).toFixed(2)}%;top:${(d.y*100).toFixed(2)}%;--r:${d.r}deg;z-index:${last?900:i+1}">${tileHTML(d.t,'lg',`data-from="${d.from}"`)}</div>`;
    d.fresh = false; return html;
  }).join('');
  const pw = HONORS[G.prevWind];
  $('#centerInfo').innerHTML = `Wall: <b>${G.wall.length}</b> tiles · Round wind <b>${pw.cn}</b> ${pw.en} · Hand ${G.handNo}`;
}
function render(){
  if (!G.players.length) return;
  ['top','left','right'].forEach(pos=>{ const el=$('#seat-'+pos); el.innerHTML=''; el.classList.add('empty'); });
  if (document.body.classList.contains('mobile')) renderAIStrip();
  else G.players.forEach(p=>{ if (!p.human) renderAISeat(p, G.pos[p.idx]); });
  G.dangerD = G.phase!=="over" && G.players[0].hand.length ? dangerMap(G.players[0]) : null;
  renderHuman(); renderPond(); renderCoach();
  document.body.classList.toggle('myturn', G.phase==='turn');
  const pw = HONORS[G.prevWind];
  $('#roundInfo').textContent = `Round ${pw.cn} ${pw.en} · min 3 fan`;
}

function pctTxt(p){ if (p>=.995) return '≈100%'; if (p<.005) return p>0?'<1%':'0%'; return Math.round(p*100)+'%'; }
function renderCoach(){
  const el = $('#coachBody'), p = G.players[0];
  if (!p){ el.innerHTML=''; return; }
  const A = G.coach;
  let h = '';
  // Status
  let status='', sub='';
  if (G.phase==='over'){ status='Hand over.'; sub='Start the next hand when you are ready.'; }
  else if (A){
    const minS = Math.min(...A.all.map(x=>x.s));
    if (G.phase==='turn' && G.turnCtx?.win?.ok) { status = '🎉 You can win right now!'; sub = `Your hand is worth ${G.turnCtx.win.fan} fan — press Win.`; }
    else if (minS<=0) { status = 'Ready! 聽牌 (tīng pái)'; sub = A.has14 ? 'Discard the right tile and you are one tile from winning.' : 'You are one tile from winning.'; }
    else { status = `${minS} tile${minS>1?'s':''} away from ready`; sub = `向聽 (xiàng tīng) = ${minS}. Ready means one tile from winning.`; }
    sub += ` About ${A.draws} draws left for you.`;
  }
  h += `<div class="sec"><div class="status">${status}<span class="sub">${sub}</span></div></div>`;
  // Hint
  h += `<div class="sec"><button class="hintbtn" id="hintBtn">💡 Hint — what should I do? (H)</button>
    ${G.hint?`<div class="hintbox">${G.hint.text}</div>`:''}</div>`;
  if (A && G.phase!=='over'){
    // Ready options
    if (A.ready.length){
      h += `<div class="sec"><h3>${A.has14?'Discards that make you ready':'You are waiting on'}</h3>`;
      A.ready.slice(0,4).forEach(r=>{
        h += `<div class="ready">${r.d!=null?`Discard ${mini(r.d)} → wait on:`:'Winning tiles:'}<div class="wl">${r.waits.map(w=>{
          const cls = w.fanD>=3?'ok':(w.fanS>=3?'so':'no');
          const lbl = w.fanD>=3?`${w.fanD} fan`:(w.fanS>=3?`${w.fanS} fan self-drawn only`:`only ${w.fanD} fan ✗`);
          return `<span class="wt ${cls}">${mini(w.t)} ${lbl} · ${w.left} left</span>`; }).join('')}</div></div>`;
      });
      h += `<div class="muted" style="font-size:14px">Green = wins on anyone's discard · Yellow = only if you draw it yourself (+1 自摸) · Red = not enough fan.</div></div>`;
    }
    // Targets
    const shown = [];
    const bestOf = pred => A.all.filter(pred).sort((a,b)=>targetScore(b)-targetScore(a) || a.s-b.s)[0];
    const ff = bestOf(x=>x.tg.kind==='flush'&&x.tg.full), hf = bestOf(x=>x.tg.kind==='flush'&&!x.tg.full);
    [hf, ff].forEach(x=>x&&shown.push(x));
    A.all.forEach(x=>{ if (x.tg.kind!=='flush' && !(x.tg.kind==='orphans' && x.s>4)) shown.push(x); });
    shown.sort((a,b)=> (b.w*b.prob - a.w*a.prob) || (a.s-b.s));
    h += `<div class="sec"><h3>Hands you could make</h3>`;
    shown.forEach(x=>{
      const ok = x.fan>=3 && !x.risky, so = !ok && x.fan+1>=3;
      const fanCls = ok?'ok':(so||x.risky?'':'no');
      const fanTxt = x.tg.kind==='orphans' ? 'Limit 13'
        : x.risky ? `≈${x.fan} fan only if you draw no flowers`
        : `≈${x.fan} fan${ok?' ✓':(so?' (3 if self-drawn)':' ✗')}`;
      const dist = x.s<0?'complete!':(x.s===0?'ready!':`${x.s} away`);
      const disc = A.has14 && x.discards.length && x.s>=0 ? ` · discard ${x.discards.slice(0,3).map(mini).join('')}` : '';
      h += `<div class="trow ${G.focus===x.tg.key?'focus':''} ${x.w?'':'nq'}" data-focus="${x.tg.key}">
        <div class="tname"><span class="cn">${x.tg.cn}</span>${x.tg.en}</div><div class="tfan ${fanCls}">${fanTxt}</div>
        <div class="tmeta">${dist} · ${x.u} useful tiles${disc}${x.tg.open?'':' · concealed only'}</div><div class="pct">${pctTxt(x.w?x.prob*x.w:x.prob)}</div>
        <div class="bar"><i style="width:${Math.round((x.w?x.prob*x.w:x.prob)*100)}%"></i></div>
        ${G.focus===x.tg.key?`<div class="tkeep">${x.tg.keep}</div>`:''}</div>`;
    });
    h += `<div class="muted" style="font-size:14px;line-height:1.45">Click a hand to dim tiles that don't fit it. Chance is a rough estimate of completing that hand from your remaining draws${''} (and claims, for open hands), using the tiles you haven't seen.</div></div>`;
    // Fan sources
    h += `<div class="sec"><h3>Fan you already have</h3><div class="fanlist">`;
    if (!A.ex.items.length && !A.ex.concealed) h += `<span class="muted">None yet.</span>`;
    A.ex.items.forEach(i=> h += `<div><span class="cn">${i.cn}</span> ${i.en} · <b>+${i.fan}</b></div>`);
    if (A.ex.concealed) h += `<div><span class="cn">門前清</span> Concealed hand (as long as you don't claim) · <b>+1</b></div>`;
    h += `<div class="muted">+1 more if you win by drawing the tile yourself (自摸).</div>`;
    A.ex.pairs.forEach(t=> h += `<div>💡 Pair of ${mini(t)} — make it a pung for <b>+1 fan</b>.</div>`);
    h += `</div></div>`;
    h += tableReadHTML(p);
  }
  // Numbers reference
  h += `<div class="sec"><details><summary>Chinese numbers 1–9 &nbsp;(一 … 九)</summary>
    <label class="chk"><input type="checkbox" id="numQuiz" ${G.numQuiz?'checked':''}> Quiz me (hover to reveal)</label>
    <div class="numgrid ${G.numQuiz?'quiz':''}">${CN_NUM.map((c,i)=>`<div class="numcard"><div class="c">${c}</div><div class="a">${i+1}</div><div class="p">${PY_NUM[i]}</div></div>`).join('')}
    <div class="numcard"><div class="c">萬</div><div class="a">10,000</div><div class="p">wàn</div></div></div></details></div>`;
  // Log
  h += `<div class="sec"><h3>Game log</h3><div class="log">${G.log.map(l=>`<div>${l}</div>`).join('')}</div></div>`;
  const scroll = $('#coach').scrollTop;
  el.innerHTML = h;
  $('#coach').scrollTop = scroll;
  const nd = el.querySelector('details'); if (nd && G.numOpen) nd.open = true;
}

function rulesHTML(){
  const rows = [
    ['自摸','Self-drawn win',1],['門前清','Concealed hand (no claimed sets)',1],['平糊','All chows (runs)',1],['無花','No flowers',1],
    ['正花','Own flower / own season (each)',1],['一台花','All four flowers or all four seasons',2],
    ['番子','Pung of a dragon 中 發 白 (each)',1],['門風','Pung of your seat wind',1],['圈風','Pung of the round wind',1],
    ['海底撈月','Win on the very last tile',1],['槓上開花','Win on a kong replacement tile',1],['搶槓','Robbing a kong: win on the tile someone adds to a pung',1],['混么九','Only terminals & honours (all pungs)',1],
    ['對對糊','All pungs',3],['混一色','Half flush: one suit + honours',3],['七對子','Seven pairs',4],['小三元','Small three dragons',5],
    ['小四喜','Small four winds',6],['清一色','Full flush: one suit only',7],['大三元','Great three dragons',8],['槓上槓','Win after two kongs in a row',8],
    ['字一色','All honours',10],['清么九','All terminals (1s and 9s)',10],
    ['十三么','Thirteen orphans','Limit'],['坎坎糊','Four concealed pungs','Limit'],['大四喜','Great four winds','Limit'],['九子連環','Nine gates','Limit'],['天糊','Heavenly hand (dealer wins on deal)','Limit'],['地糊','Earthly hand (win on the dealer’s first discard)','Limit'],
    ['十八羅漢','Four kongs','Limit'],['八仙過海','All eight flowers & seasons (instant win)','Limit']];
  return `<h2>Hong Kong Mahjong — quick rules</h2>
  <p class="lead">Goal: 4 sets + 1 pair (14 tiles). A set is a <b>chow</b> 上 (run like 3-4-5 of one suit), a <b>pung</b> 碰 (three of a kind) or a <b>kong</b> 槓 (four of a kind). You need at least <b>3 fan</b> to declare a win.</p>
  <ul style="font-size:16px;line-height:1.6;padding-left:18px">
    <li>On your turn you draw, then discard one tile (click it).</li>
    <li>You can <b>pung</b> or <b>kong</b> anyone's discard, but <b>chow</b> only from the player just before you.</li>
    <li>Winning beats pung/kong, which beat chow.</li>
    <li>Claiming a tile exposes the set and loses the 門前清 concealed bonus.</li>
    <li>Flowers/seasons are set aside automatically and give bonus fan; your own flower is number ${'1=East, 2=South, 3=West, 4=North'}.</li>
    <li>Scoring: points = 2^fan-ish table (3 fan = 8 … limit = 256). Discarder pays double; on a self-draw everyone pays.</li>
  </ul>
  <table class="rules">${rows.map(r=>`<tr><td class="cn">${r[0]}</td><td>${r[1]}</td><td class="f">${r[2]}</td></tr>`).join('')}</table>
  <div class="mbtns"><button class="mbtn" onclick="$('#rulesModal').classList.remove('show')">Got it</button></div>`;
}

/* ================= Events ================= */
document.addEventListener('click', e=>{
  const b = e.target.closest('[data-act]');
  if (b && !b.disabled){
    const a = b.dataset.act, ctx = G.turnCtx;
    if (a==='win' && G.phase==='turn') act({type:'win'});
    else if (a==='kong' && G.phase==='turn') act({type:'kong', k:ctx.kongs[+b.dataset.k]});
    else if (G.phase==='claim'){
      if (a==='cwin') act({type:'win'});
      else if (a==='ckong') act({type:'kong'});
      else if (a==='cpung') act({type:'pung'});
      else if (a==='cchow') act({type:'chow', start:+b.dataset.st});
      else if (a==='pass') act({type:'pass'});
    }
    return;
  }
  if (e.target.closest('[data-sort]')){ if (G.tray) sortTray(); return; }
  const d = e.target.closest('[data-discard]');
  if (d && G.phase==='turn'){ act({type:'discard', t:+d.dataset.discard}); return; }
  const f = e.target.closest('[data-focus]');
  if (f){ G.focus = G.focus===f.dataset.focus ? null : f.dataset.focus; render(); return; }
  if (e.target.id==='hintBtn') showHint();
});
// Pointer dragging inside the tray (click without moving = discard)
let drag = null;
document.addEventListener('pointerdown', e=>{
  const el = e.target.closest && e.target.closest('.tray .tile[data-item]');
  if (!el || e.button!==0) return;
  const tray = el.parentElement, r = tray.getBoundingClientRect();
  const it = G.tray.items.find(i=>i.id===+el.dataset.item); if (!it) return;
  drag = {el, it, sx:e.clientX, sy:e.clientY, z: r.width / tray.offsetWidth || 1, moved:false, touch: e.pointerType!=='mouse',
          ox: parseFloat(el.style.left), oy: parseFloat(el.style.top)};
  try { el.setPointerCapture(e.pointerId); } catch(_){} e.preventDefault();
});
document.addEventListener('pointermove', e=>{
  if (!drag) return;
  const dx = (e.clientX-drag.sx)/drag.z, dy = (e.clientY-drag.sy)/drag.z;
  if (!drag.moved && Math.hypot(dx,dy) < 6) return;
  if (!drag.moved){ drag.moved = true; drag.el.classList.add('dragging'); tip.style.display='none'; }
  drag.el.style.left = (drag.ox+dx)+'px'; drag.el.style.top = (drag.oy+dy)+'px';
});
document.addEventListener('pointerup', e=>{
  if (!drag) return;
  const d = drag; drag = null;
  if (!d.moved){
    if (d.touch && G.selItem!==d.it.id){
      // touch: first tap lifts the tile and reveals its Chinese / pinyin
      G.selItem = d.it.id; render();
      const nel = document.querySelector(`.tray .tile[data-item="${d.it.id}"]`);
      if (nel) showTipAt(nel, tileTip(d.it.t) + (G.phase==='turn' ? '<br><span style="opacity:.75">Tap again to discard</span>' : ''));
      return;
    }
    G.selItem = null;
    if (G.phase==='turn'){ G.trayRemoveId = d.it.id; tip.style.display='none'; act({type:'discard', t:d.it.t}); }
    else render();
    return;
  }
  const dx = (e.clientX-d.sx)/d.z, dy = (e.clientY-d.sy)/d.z;
  const x = Math.round(((d.ox+dx)/G.trayTW)*20)/20, y = Math.round(((d.oy+dy)/G.trayTH)*20)/20;
  const s = freeSpot(x, y, d.it); d.it.x = s.x; d.it.y = s.y;
  render();
});
document.addEventListener('pointercancel', ()=>{ if (drag){ drag=null; render(); } });
document.addEventListener('change', e=>{
  if (e.target.id==='optDangerDots'){ S.dangerDots = e.target.checked; saveS(); render(); return; }
  if (e.target.id==='rvOnlyBad'){ G.reviewOnlyBad = e.target.checked; openReview($('#reviewModal').dataset.fromEnd==='1'); return; }
  if (e.target.id==='numQuiz'){ G.numQuiz = e.target.checked; G.numOpen = true; renderCoach(); }
});
document.addEventListener('toggle', e=>{ if (e.target.tagName==='DETAILS' && e.target.closest('#coachBody')) G.numOpen = e.target.open; }, true);
$('#hintTop').onclick = showHint;
$('#coachToggle').onclick = ()=>{ document.body.classList.toggle('coach-open'); setTimeout(render, 320); };
$('#coachClose').onclick = ()=>{ document.body.classList.remove('coach-open'); setTimeout(render, 320); };
$('#handsBtn').onclick = openHands;
document.addEventListener('input', e=>{ if (e.target.id==='handsLimit'){ G.handsLimit = +e.target.value; applyHandsFilter(); } });
$('#reviewBtn').onclick = ()=>openReview(G.phase==='over');
$('#rulesBtn').onclick =()=>{ $('#rulesBody').innerHTML = rulesHTML(); $('#rulesModal').classList.add('show'); };
$('#settingsBtn').onclick = openSettings;
$('#settingsCancel').onclick = ()=>{ if (G.players.length) $('#settingsModal').classList.remove('show'); };
$('#startBtn').onclick = ()=>{
  S.ai = +document.querySelector('input[name=ai]:checked').value;
  S.aiStyle = document.querySelector('input[name=aistyle]:checked').value;
  S.mode = document.querySelector('input[name=mode]:checked').value;
  S.speed = document.querySelector('input[name=speed]:checked').value;
  S.flowers = $('#optFlowers').checked; S.tips = $('#optTips').checked;
  saveS(); applyMode();
  $('#settingsModal').classList.remove('show');
  newGame();
};
function openSettings(){
  document.querySelector(`input[name=ai][value="${S.ai}"]`).checked = true;
  document.querySelector(`input[name=aistyle][value="${S.aiStyle||'mixed'}"]`).checked = true;
  document.querySelector(`input[name=mode][value="${S.mode}"]`).checked = true;
  document.querySelector(`input[name=speed][value="${S.speed}"]`).checked = true;
  $('#optFlowers').checked = S.flowers; $('#optTips').checked = S.tips;
  $('#settingsCancel').style.display = G.players.length ? '' : 'none';
  $('#settingsModal').classList.add('show');
}
function applyMode(){
  document.body.classList.remove('mode-hover','mode-quiz','mode-chinese','mode-arabic');
  document.body.classList.add('mode-'+S.mode);
}
document.addEventListener('keydown', e=>{
  if (e.target.tagName==='INPUT') return;
  if (e.key==='h'||e.key==='H') showHint();
  else if (e.key==='c'||e.key==='C') $('#coachToggle').click();
  else if ((e.key==='p'||e.key==='P'||e.key===' ') && G.phase==='claim'){ e.preventDefault(); act({type:'pass'}); }
});
// Tooltip
const tip = $('#tip');
document.addEventListener('mousemove', e=>{
  const el = e.target.closest('[data-t],[data-tipx]');
  if (!el || !S.tips || el.classList.contains('back')){ tip.style.display='none'; return; }
  let html = el.dataset.tipx || tileTip(+el.dataset.t);
  if (el.dataset.from!=null && G.players[+el.dataset.from]) html += `<br><span style="opacity:.7">Discarded by ${G.players[+el.dataset.from].name}</span>`;
  tip.innerHTML = html; tip.style.display='block';
  const z = S.scale || 1;
  const x = Math.min(e.clientX+14, innerWidth - tip.offsetWidth*z - 8), y = Math.max(8, e.clientY - tip.offsetHeight*z - 12);
  tip.style.left = (x/z)+'px'; tip.style.top = (y/z)+'px';
});
function showTipAt(el, html){
  if (!S.tips) return;
  tip.innerHTML = html; tip.style.display='block';
  const z = S.scale || 1, r = el.getBoundingClientRect();
  const x = Math.max(8, Math.min(r.left + r.width/2 - tip.offsetWidth*z/2, innerWidth - tip.offsetWidth*z - 8));
  const y = Math.max(8, r.top - tip.offsetHeight*z - 10);
  tip.style.left = (x/z)+'px'; tip.style.top = (y/z)+'px';
}
// Touch: tapping a tile anywhere outside your hand (discards, melds, coach) reveals it briefly
document.addEventListener('pointerdown', e=>{
  if (e.pointerType==='mouse') return;
  const el = e.target.closest && e.target.closest('[data-t]');
  if (!el){ if (!e.target.closest('.tray')){ tip.style.display='none'; if (G.selItem){ G.selItem=null; render(); } } return; }
  if (el.closest('.tray') || el.classList.contains('back')) return;
  document.querySelectorAll('.tile.reveal').forEach(x=>{ if (!x.closest('.tray')) x.classList.remove('reveal'); });
  el.classList.add('reveal');
  let html = tileTip(+el.dataset.t);
  if (el.dataset.from!=null && G.players[+el.dataset.from]) html += `<br><span style="opacity:.7">Discarded by ${G.players[+el.dataset.from].name}</span>`;
  showTipAt(el, html);
  clearTimeout(showTipAt.t); showTipAt.t = setTimeout(()=>{ tip.style.display='none'; el.classList.remove('reveal'); }, 2500);
});
// Interface size
const SCALE_MIN = .8, SCALE_MAX = 1.8;
function applyScale(){
  S.scale = Math.round(Math.max(SCALE_MIN, Math.min(SCALE_MAX, S.scale||1))*20)/20;
  document.body.style.zoom = S.scale;
  document.body.style.setProperty('--z', S.scale);
  updateLayoutClass();
  $('#scalePct').textContent = Math.round(S.scale*100)+'%';
  const sl = $('#optScale'); if (sl){ sl.value = S.scale; $('#optScaleVal').textContent = Math.round(S.scale*100)+'%'; }
  render();
}
function bumpScale(d){ S.scale = (S.scale||1) + d; saveS(); applyScale(); }
$('#scaleDown').onclick = ()=>bumpScale(-.1);
$('#scaleUp').onclick = ()=>bumpScale(.1);
$('#optScale').oninput = e=>{ S.scale = +e.target.value; saveS(); applyScale(); };
document.addEventListener('keydown', e=>{
  if (e.target.tagName==='INPUT') return;
  if (e.key==='+'||e.key==='=') bumpScale(.1);
  else if (e.key==='-'||e.key==='_') bumpScale(-.1);
});
applyScale();
function updateLayoutClass(){
  const w = innerWidth / (S.scale||1);
  const wasMobile = document.body.classList.contains('mobile');
  document.body.classList.toggle('mobile', w < 700);
  if (w < 700 && !wasMobile) document.body.classList.remove('coach-open');
  document.body.classList.toggle('narrow', w < 1000);
  document.body.classList.toggle('tiny', w < 640);
}
window.addEventListener('resize', ()=>{ updateLayoutClass(); render(); });

applyMode();
openSettings();
</script>
